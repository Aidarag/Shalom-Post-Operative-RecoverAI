<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Outer ambient glow filter -->
    <filter id="auraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- 3D Spherical Base Gradient -->
    <radialGradient id="bubbleSphere" cx="34%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="16%" stop-color="#F5F3FF" />
      <stop offset="36%" stop-color="#DDD6FE" />
      <stop offset="60%" stop-color="#A855F7" />
      <stop offset="82%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#3B0764" />
    </radialGradient>

    <!-- Specular highlight gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.2" />
    </linearGradient>

    <!-- Bottom edge reflection -->
    <radialGradient id="bottomRim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="24" cy="24" r="20" fill="#7C3AED" opacity="0.25" filter="url(#auraGlow)" />

  <!-- 3D Spherical Orb -->
  <circle cx="24" cy="24" r="18.5" fill="url(#bubbleSphere)" stroke="#FFFFFF" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Bottom Refractive Glow -->
  <ellipse cx="27" cy="35" rx="9" ry="4.5" fill="url(#bottomRim)" />

  <!-- Specular Sheen (Curved Highlight) -->
  <ellipse cx="18" cy="14" rx="6.5" ry="3.5" transform="rotate(-30 18 14)" fill="url(#sheenGrad)" />

  <!-- Pinpoint Specular Glint -->
  <circle cx="16" cy="11.5" r="1.5" fill="#FFFFFF" opacity="0.9" />

  <!-- Live Intelligence Dot -->
  <circle cx="36.5" cy="36.5" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.8" />
</svg>